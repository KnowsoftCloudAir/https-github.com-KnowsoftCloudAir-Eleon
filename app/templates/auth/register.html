<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Eleon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Eleon">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
  <form method="post" action="/register" class="w-full max-w-md rounded-3xl border border-white/10 bg-slate-900/90 p-8 space-y-4">
    <a href="/" class="text-teal-300 text-sm">← Eleon</a>
    <h1 class="text-2xl font-bold">Create account</h1>
    {% if error %}<p class="text-rose-400 text-sm">{{ error }}</p>{% endif %}
    {% if success %}<p class="text-emerald-400 text-sm">{{ success }}</p>{% endif %}
    <input name="full_name" required placeholder="Full name" class="w-full rounded-xl px-3 py-2 text-slate-900">
    <input name="email" type="email" required placeholder="Email" class="w-full rounded-xl px-3 py-2 text-slate-900">
    <input name="password" type="password" required minlength="6" placeholder="Password" class="w-full rounded-xl px-3 py-2 text-slate-900">
    <input name="access_code" placeholder="Access code (optional — week/month/year)" class="w-full rounded-xl px-3 py-2 text-slate-900">
    <p class="text-xs text-slate-500">Without a code, admin must approve you and issue a login number.</p>
    <button class="w-full rounded-xl bg-teal-600 hover:bg-teal-500 py-2.5 font-bold">Register</button>
    <p class="text-sm text-slate-400">Have an account? <a href="/login" class="text-teal-300">Sign in</a></p>
  </form>
</body>
</html>
