<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evaluation — {{ eval.title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
  <form method="post" class="w-full max-w-lg rounded-3xl border border-white/10 bg-slate-900/90 p-6 space-y-4">
    <img src="/static/icons/icon-192.png" class="h-12 w-12 rounded-xl" alt="">
    <h1 class="text-xl font-bold">{{ eval.title }}</h1>
    <p class="text-sm text-slate-400">{{ presentation.title if presentation else '' }}</p>
    <input name="participant_name" required placeholder="Your name" class="w-full rounded-xl px-3 py-2 text-slate-900">
    <input name="participant_email" type="email" placeholder="Email" class="w-full rounded-xl px-3 py-2 text-slate-900">
    {% for q in questions %}
    <div class="border-t border-white/10 pt-3">
      <p class="text-sm font-semibold mb-2">{{ loop.index }}. {{ q.prompt }}</p>
      {% set opts = q.options.splitlines() if q.options else [] %}
      {% if opts %}
        {% for o in opts %}
        <label class="flex items-center gap-2 text-sm mb-1"><input type="radio" name="q_{{ q.id }}" value="{{ o.strip() }}" required> {{ o.strip() }}</label>
        {% endfor %}
      {% else %}
        <input name="q_{{ q.id }}" class="w-full rounded-xl px-3 py-2 text-slate-900" required>
      {% endif %}
    </div>
    {% endfor %}
    <button class="w-full rounded-xl bg-teal-600 py-2.5 font-bold">Submit</button>
  </form>
</body>
</html>
