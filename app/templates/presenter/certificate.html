<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Certificate — {{ name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print{.no-print{display:none} body{background:#fff}}
    .gold-border{
      border: 12px solid transparent;
      border-image: linear-gradient(135deg,#fef3c7,#d97706,#fbbf24,#92400e,#fde68a) 1;
      box-shadow: inset 0 0 0 2px #fbbf24, 0 25px 60px rgba(146,64,14,.25);
      background:
        radial-gradient(ellipse at 20% 0%, rgba(251,191,36,.15), transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(180,83,9,.12), transparent 45%),
        linear-gradient(180deg,#fffbeb,#fff,#fef3c7);
    }
    .gold-text{
      background: linear-gradient(90deg,#92400e,#d97706,#fbbf24,#b45309,#92400e);
      -webkit-background-clip: text; color: transparent;
    }
  </style>
</head>
<body class="min-h-screen bg-stone-800 flex items-center justify-center p-6">
  <div class="no-print fixed top-4 right-4 flex gap-2">
    <button onclick="print()" class="rounded-lg bg-amber-600 text-white px-4 py-2 font-semibold">Print</button>
  </div>
  <div class="w-full max-w-3xl aspect-[1.414/1] gold-border p-10 text-center flex flex-col justify-center relative">
    <div class="absolute top-4 left-4 right-4 flex justify-between items-start opacity-90">
      <img src="/static/img/knowsoft-logo.png" class="h-10" onerror="this.src='/static/icons/icon-192.png'">
      <p class="text-[10px] uppercase tracking-[0.25em] text-amber-800">Knowsoft · Eleon</p>
    </div>
    <p class="text-amber-700 text-xs uppercase tracking-[0.4em] mt-6">Certificate of Participation</p>
    <h1 class="text-4xl font-serif font-bold gold-text mt-4">Training Achievement</h1>
    <div class="mx-auto my-4 h-1 w-40 bg-gradient-to-r from-transparent via-amber-500 to-transparent"></div>
    <p class="text-stone-600">This is proudly presented to</p>
    <p class="text-3xl font-bold text-amber-900 my-4 font-serif">{{ name }}</p>
    <p class="text-stone-600">for active participation in</p>
    <p class="text-xl font-semibold text-stone-800 mt-2">{{ presentation.title if presentation else eval.title }}</p>
    <p class="text-sm text-amber-800/80 mt-8">May your learning continue to shine.</p>
    <div class="mt-10 flex justify-around text-xs text-stone-500">
      <div><div class="h-px w-28 bg-amber-700/50 mb-1 mx-auto"></div>Facilitator</div>
      <div><div class="h-px w-28 bg-amber-700/50 mb-1 mx-auto"></div>Date</div>
    </div>
  </div>
</body>
</html>
