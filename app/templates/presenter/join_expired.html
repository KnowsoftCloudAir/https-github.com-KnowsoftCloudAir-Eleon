<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session ended — Eleon</title>
  <link rel="icon" href="/static/icons/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">
  <div class="w-full max-w-md rounded-3xl border border-white/10 bg-slate-900/90 p-8 text-center space-y-5">
    <img src="/static/img/knowsoft-logo.png" alt="Knowsoft" class="h-14 mx-auto" onerror="this.src='/static/icons/icon-192.png'">
    <p class="text-xs uppercase tracking-widest text-rose-300">Eleon live link</p>
    <h1 class="text-2xl font-bold">Session ended and link expired</h1>
    <p class="text-slate-300 text-sm">Request another link from the presenter to join a new live session.</p>
    <div class="border-t border-white/10 pt-5 space-y-3">
      <p class="text-xs text-slate-500 uppercase tracking-wide">Download Eleon for a better experience</p>
      <a href="{{ windows_url }}" target="_blank" rel="noopener"
         class="block w-full rounded-xl bg-indigo-600 hover:bg-indigo-500 py-3 font-bold text-sm">
        Eleon for Windows
      </a>
      <a href="{{ android_url }}" target="_blank" rel="noopener"
         class="block w-full rounded-xl bg-emerald-600 hover:bg-emerald-500 py-3 font-bold text-sm">
        Eleon for Android
      </a>
      {% if download_url %}
      <a href="{{ download_url }}" target="_blank" rel="noopener" class="block text-xs text-amber-300 underline pt-1">More download options</a>
      {% endif %}
    </div>
    <a href="/" class="text-sm text-teal-300">Back to Eleon home</a>
  </div>
</body>
</html>
