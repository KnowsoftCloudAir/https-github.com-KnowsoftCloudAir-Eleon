<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q&A notes — Eleon</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-6">
  <a href="/presentations/{{ presentation.id }}/edit" class="text-teal-300 text-sm">← Editor</a>
  <h1 class="text-xl font-bold mt-2">Questions Eleon answered</h1>
  <div class="mt-4 space-y-3 max-w-3xl">
    {% for n in notes %}
    <div class="rounded-xl border border-white/10 p-4">
      <p class="text-amber-200 text-sm font-semibold">Q: {{ n.question }}</p>
      <p class="text-slate-300 text-sm mt-1">A: {{ n.answer }}</p>
      <p class="text-xs text-slate-500 mt-2">{{ n.created_at }}</p>
    </div>
    {% else %}
    <p class="text-slate-500">No notes yet.</p>
    {% endfor %}
  </div>
</body>
</html>
