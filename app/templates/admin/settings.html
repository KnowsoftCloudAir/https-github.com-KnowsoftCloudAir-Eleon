<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App download links — Eleon Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-6">
  <a href="/admin" class="text-teal-300 text-sm">← Admin</a>
  <h1 class="text-2xl font-bold mt-2">Eleon app download links</h1>
  <p class="text-sm text-slate-400 mb-4">Shown to join-link users as “Download Eleon for better experience”.</p>
  <form method="post" class="max-w-xl space-y-3 rounded-2xl border border-white/10 p-5">
    <label class="block text-xs text-slate-400">General download page URL</label>
    <input name="download_url" value="{{ download_url }}" class="w-full rounded-xl px-3 py-2 text-slate-900">
    <label class="block text-xs text-slate-400">Android APK / Play Store</label>
    <input name="android_url" value="{{ android_url }}" class="w-full rounded-xl px-3 py-2 text-slate-900">
    <label class="block text-xs text-slate-400">iOS / App Store</label>
    <input name="ios_url" value="{{ ios_url }}" class="w-full rounded-xl px-3 py-2 text-slate-900">
    <label class="block text-xs text-slate-400">Windows installer</label>
    <input name="windows_url" value="{{ windows_url }}" class="w-full rounded-xl px-3 py-2 text-slate-900">
    <button class="rounded-xl bg-teal-600 px-5 py-2 font-bold">Save</button>
  </form>
  <p class="text-xs text-slate-500 mt-4">Deep link scheme for installed app: <code class="text-amber-200">eleon://join/TOKEN</code></p>
</body>
</html>
