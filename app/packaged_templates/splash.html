<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eleon — Your presentation partner</title>
  <link rel="icon" href="/static/icons/icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes rise { from { opacity:0; transform:translateY(28px) scale(.96);} to { opacity:1; transform:none;} }
    @keyframes glow { 0%,100%{box-shadow:0 0 50px rgba(20,184,166,.3);} 50%{box-shadow:0 0 80px rgba(99,102,241,.4);} }
    .splash-card { animation: rise 1s ease-out both, glow 3.5s ease-in-out infinite; }
  </style>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Eleon">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-white flex items-center justify-center p-6">
  <div class="splash-card max-w-lg w-full rounded-3xl border border-white/10 bg-slate-900/85 backdrop-blur-xl p-10 text-center">
    <img src="/static/img/knowsoft-logo.png" alt="Knowsoft" class="mx-auto h-16 w-auto max-w-[200px] object-contain mb-3"
         onerror="this.src='/static/icons/icon-192.png'; this.className='mx-auto h-20 w-20 rounded-2xl shadow-lg border border-white/10 mb-4'">
    <img src="/static/icons/icon-192.png" alt="" class="mx-auto h-14 w-14 rounded-2xl shadow-lg border border-white/10 mb-4 opacity-95">
    <p class="text-xs uppercase tracking-[0.35em] text-teal-300/90 mb-2">Knowsoft · Churchgate family</p>
    <h1 class="text-4xl font-black tracking-[0.2em] text-transparent bg-clip-text bg-gradient-to-r from-teal-300 via-cyan-200 to-indigo-300">ELEON</h1>
    <p class="mt-4 text-lg text-slate-100">Welcome to Eleon… your presentation partner</p>
    <p class="mt-2 text-sm text-slate-400">Design slides · Present with voice · Answer from your content</p>
    <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
      {% if user %}
      <a href="/dashboard" class="rounded-xl bg-teal-600 hover:bg-teal-500 px-6 py-3 font-bold">Open dashboard</a>
      {% else %}
      <a href="/login" class="rounded-xl bg-teal-600 hover:bg-teal-500 px-6 py-3 font-bold">Sign in</a>
      <a href="/register" class="rounded-xl border border-white/20 hover:bg-white/5 px-6 py-3 font-semibold">Register</a>
      {% endif %}
    </div>
    <p class="mt-6 text-[11px] text-slate-500">Demo: demo@eleon.app / demo123</p>
  </div>

  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function(){});
  }
  </script>

</body>
</html>
